<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration Form</title>
    <style>
        body {
            background-image: url('../orange.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .navbar {
            background-color: rgb(180, 73, 2);
            padding: 20px;
            text-align: center;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .navbar a {
            color: white;
            font-size: 2rem;
            text-decoration: none;
            transition: transform 0.5s ease, color 0.5s ease;
            display: inlick-block;
        }

        .navbar a:hover {
            transform: scale(1.2);
            text-shadow: 0 0 10px white;
        }

        .navbar a:visited {
            text-decoration: none;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            font-size: 12px;
            color: gray;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .radio-group label {
            font-weight: normal;
        }

        .terms {
            margin-top: 15px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        button[type="submit"] {
            background-color: #007bff;
        }

        button[type="reset"] {
            background-color: #6c757d;
        }

        button:hover {
            opacity: 0.9;
        }        

        /* GO BACK BUTTON */
        .back-btn {
            position: absolute;   
            top: 110px;           
            left: 20px;           
            background-color: rgb(243, 121, 39); 
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.2s ease;
            z-index: 10;          
        }

        .back-btn:hover {
            background-color: rgb(140, 50, 2);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="../index.html">Home</a>
        <a href="../dashboard.html">Dashboard</a>
        <a href="../quiz.html">Quiz</a>
        <a href="../lab.html">Lab</a>
        <a href="../exam.html">Exam</a>
    </nav>

    <a href="../lab.html" class="back-btn">Go Back</a>

<div class="container">
    <h2>User Registration Form</h2>
    <p class="subtitle">Based on "Introduction to JavaScript" Lecture - Open Console (F12)</p>

    <form id="regForm">
        <label>Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter password (min 6 characters)">

        <label>Confirm Password:</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password">

        <label>Age:</label>
        <input type="number" id="age" placeholder="Enter your age (18-120)">

        <label>Gender:</label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>

        <label>Country:</label>
        <select id="country">
            <option value="">Select a country</option>
            <option>Philippines</option>
            <option>USA</option>
            <option>Japan</option>
            <option>Canada</option>
        </select>

        <div class="terms">
            <input type="checkbox" id="terms">
            <label>I agree to the Terms and Conditions</label>
        </div>

        <div class="buttons">
            <button type="submit">Register</button>
            <button type="reset">Clear Form</button>
        </div>
    </form>
</div>

<script>
    document.getElementById("regForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;
    let age = document.getElementById("age").value;
    let gender = document.querySelector('input[name="gender"]:checked');
    let country = document.getElementById("country").value;
    let terms = document.getElementById("terms").checked;

    // Validation
    if (name === "") {
        alert("Full name is required.");
        return;
    }

    if (email === "") {
        alert("Email is required.");
        return;
    }

    if (password === "") {
        alert("Password is required.");
        return;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
    }

    if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
    }

    if (age < 18 || age > 120) {
        alert("Age must be between 18 and 120.");
        return;
    }

    if (!gender) {
        alert("Please select a gender.");
        return;
    }

    if (country === "") {
        alert("Please select a country.");
        return;
    }

    if (!terms) {
        alert("You must agree to the Terms and Conditions.");
        return;
    }

    alert(
        "Name: " + name + "\n" +
        "Email: " + email + "\n" +
        "Age: " + age + "\n" +
        "Gender: " + gender.value + "\n" +
        "Country: " + country);
});
</script>
</body>
</html>
