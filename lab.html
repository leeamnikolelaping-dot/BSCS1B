<!DOCTYPE html>
<html lang="en">
    <head>

        <nav class="navbar">

        <div class="container">
            <h2>Lab Work Upload</h2>
            <form class="uploadForm">
                <label>Title/Description:</label>
                <input type="text" id="title" placeholder="Enter lab work title" required>

                <label>File Upload:</label>
                <input type="file" id="labFile" required>

                <label>Proof Image (Required):</label>
                <input type="file" id="proofImage" accept="image/*" required>

                <button type="submit">Submit Lab Work</button>
            </form>
            <div id="statusMessage"></div>
        </div>

        <button class="toggle-btn" id="sidebarToggleBtn">🔬</button>

        <div class="sidebar" id="mySidebar">
            <a href="Lab/act-1.html" class="activity">Lab Activity 1</a>
            <a href="Lab/act-2.html" class="activity">Lab Activity 2</a>
            <a href="Lab/act-3.html" class="activity">Lab Activity 3</a>
        </div>

        <script src="upload.js"></script>
    </body>
