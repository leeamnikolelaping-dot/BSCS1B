<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz</title>
        <link rel="stylesheet" href="upload.css">
    </head>
    <body>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="#">Quiz</a>
            <a href="lab.html">Lab</a>
            <a href="exam.html">Exam</a>
        </nav>

        <div class="container">
            <h2>Quiz Upload</h2>
            <form class="uploadForm">
                <label>Title/Description:</label>
                <input type="text" id="title" placeholder="Enter quiz title" required>

                <label>File Upload:</label>
                <input type="file" id="quizFile" required>

                <label>Proof Image (Required):</label>
                <input type="file" id="proofImage" accept="image/*" required>

                <button type="submit">Submit Quiz</button>
            </form>
            <div id="statusMessage"></div>
        </div>

        <div class="static-image-section">
            <div class="large-image-container">
                <h2 class="section-header">Quiz 1</h2>
                <img src="quiz-1.jpg" alt="Quiz 1 Score">
            </div>
        </div>    
        <div class="static-image-section">
            <div class="large-image-container">
                <h2 class="section-header">Quiz 2</h2>
                <img src="quiz-2.jpg" alt="Quiz 2 Score">
            </div>
        </div>
        <div class="static-image-section">
            <div class="large-image-container">
                <h2 class="section-header">Quiz 3</h2>
                <img src="quiz-3.jpg" alt="Quiz 3 Score">
            </div>
        </div>
        <div class="static-image-section">
            <div class="large-image-container">
                <h2 class="section-header">Final Quiz 1</h2>
                <img src="fquiz-1.jpg" alt="Final Quiz 1 Score">
            </div>
        </div>
        <div class="static-image-section">
            <div class="large-image-container">
                <h2 class="section-header">Final Quiz 2</h2>
                <img src="fquiz-2.jpg" alt="Final Quiz 2 Score">
            </div>
        </div>
        <div class="static-image-section">
            <div class="large-image-container">
                <h2 class="section-header">Final Long Test</h2>
                <img src="long-test.jpg" alt="Long Test Score">
            </div>
        </div>

        <script src="upload.js"></script>
    </body>
</html>
